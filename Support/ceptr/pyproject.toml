[project]
name = "ceptr"
version = "0.1.0"
description = "Converts Cantera mechanisms to C++ for the Pele codes"
authors = [
    { name = "Marc Henry de Frahan", email = "marc.henrydefrahan@nrel.gov" },
    { name = "Lucas Esclapez" },
    { name = "Jon Rood" },
    { name = "Hari Sitaraman" },
    { name = "Marc Day" },
    { name = "Anne Felden" },
    { name = "Julia Ream" },
    { name = "Malik Hassanaly" },
    { name = "Nick Wimer" },
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "cantera>=3.1.0",
    "pint>=0.23,<0.24",
    "pyyaml>=6.0.1,<7",
    "networkx>=2.8.8,<3",
    "matplotlib>=3.7.2,<4",
    "scipy>=1.11.2,<2",
    "numpy>=1.25.2,<2",
    "sympy==1.14",
    "symengine>=0.9.2,<0.10",
    "pandas>=2.0.3",
    "toml>=0.10.2",
    "pyarrow>=15.0.0,<16",
    # Formats the generated C++
    "clang-format==20.1.5",
]

[project.scripts]
convert = "ceptr.ceptr:main"
qssa = "ceptr.qssa:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "ruff>=0.17.6,<0.18",
    "ipython>=8.14.0,<9",
]

[tool.uv]
# CI installs this version too, through setup-uv
required-version = "==0.13.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The rules of the former flake8 setup (pycodestyle, pyflakes, bugbear,
# pep8-naming, docstrings), isort, and f-strings for flake8-use-fstring/flynt
select = ["E", "W", "F", "B", "N", "D", "I", "UP031", "UP032"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88; like flake8-bugbear's B950, only flag lines
# (long strings or comments) more than 10% over
max-line-length = 96

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
