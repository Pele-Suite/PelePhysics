[project]
name = "ceptr"
version = "0.1.0"
description = "Converts Cantera mechanisms to C++ for the Pele codes"
authors = [
    { name = "Marc Henry de Frahan", email = "marc.henrydefrahan@nrel.gov" },
    { name = "Lucas Esclapez" },
    { name = "Jon Rood" },
    { name = "Hari Sitaraman" },
    { name = "Marc Day" },
    { name = "Anne Felden" },
    { name = "Julia Ream" },
    { name = "Malik Hassanaly" },
    { name = "Nick Wimer" },
]
# SPEC 0 (https://scientific-python.org/specs/spec-0000/): Python versions
# released in the last 3 years, and the core scientific packages released in
# the last 2. Cantera has no wheels for Python 3.15 yet.
requires-python = ">=3.13,<3.15"
dependencies = [
    "cantera>=3.1",
    "numpy>=2.2",
    "pint>=0.25",
    "pyyaml>=6.0.2",
    # sympy and symengine shape the generated QSS Jacobians: they are pinned
    # so that pip installs give the same mechanisms as uv.lock
    "sympy==1.14.0",
    "symengine==0.15.0",
    # Formats the generated C++: pinned so that the mechanisms do not change
    "clang-format==20.1.5",
]

[project.optional-dependencies]
# qssa -v, and the plotting scripts the docs run in this environment
# (plotPMF.py, gen_hit_ic.py)
plot = [
    "matplotlib>=3.10",
    "networkx>=3.5",
    # Used by networkx's kamada_kawai_layout, and by gen_hit_ic.py
    "scipy>=1.15",
]

[project.scripts]
convert = "ceptr.ceptr:main"
qssa = "ceptr.qssa:main"

[dependency-groups]
# Only ruff, so that CI can lint without installing CEPTR
lint = [
    "ruff>=0.17.6,<0.18",
]
dev = [
    "pytest>=8.4",
    "ipython>=8.30",
    { include-group = "lint" },
]

[tool.uv]
# CI installs this version too (.github/actions/setup-uv)
required-version = "==0.13.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# The rules of the former flake8 setup (pycodestyle, pyflakes, bugbear,
# pep8-naming, docstrings), isort, and pyupgrade for the supported Python
select = ["E", "W", "F", "B", "N", "D", "I", "UP"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88; like flake8-bugbear's B950, only flag lines
# (long strings or comments) more than 10% over
max-line-length = 96

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
