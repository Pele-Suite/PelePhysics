[tool.poetry]
name = "ceptr"
version = "0.1.0"
description = ""
authors = ["Marc Henry de Frahan <marc.henrydefrahan@nrel.gov>", "Lucas Esclapez", "Jon Rood", "Hari Sitaraman", "Marc Day", "Anne Felden", "Julia Ream", "Malik Hassanaly", "Nick Wimer"]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
Cantera = ">=3.1.0"
Pint = "^0.23"
PyYAML = "^6.0.1"
networkx = "^2.8.8"
matplotlib = "^3.7.2"
scipy = "^1.11.2"
numpy = "^1.25.2"
sympy = "==1.14"
symengine = "^0.9.2"
pandas = ">=2.0.3"
toml = ">=0.10.2"
pyarrow = "^15.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.17.6"
ipython = "^8.14.0"
clang-format = "==20.1.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
convert = "ceptr.ceptr:main"
qssa = "ceptr.qssa:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The rules of the former flake8 setup (pycodestyle, pyflakes, bugbear,
# pep8-naming, docstrings), isort, and f-strings for flake8-use-fstring/flynt
select = ["E", "W", "F", "B", "N", "D", "I", "UP031", "UP032"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88; like flake8-bugbear's B950, only flag lines
# (long strings or comments) more than 10% over
max-line-length = 96

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
