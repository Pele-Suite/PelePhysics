name: PelePhysics-Docs

on:
  push:
    branches: [development]
    paths:
       - 'Docs/**'
       - 'README.md'
       - '.github/workflows/docs.yml'
  pull_request:
    branches: [development]
    paths:
       - 'Docs/**'
       - 'README.md'
       - '.github/workflows/docs.yml'

jobs:
  Docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx_rtd_theme
      - name: Configure
        run: cmake -B${{runner.workspace}}/build-docs ${{github.workspace}}/Docs
      # Sphinx runs with -W, so warnings fail the build; bash -eo pipefail
      # keeps that status through the tee.
      - name: Build
        working-directory: ${{runner.workspace}}/build-docs
        shell: bash
        run: |
          echo "::add-matcher::${{github.workspace}}/.github/problem-matchers/sphinx.json"
          cmake --build ${{runner.workspace}}/build-docs 2>&1 | tee -a build-output.txt
          touch ${{runner.workspace}}/build-docs/sphinx/html/.nojekyll
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ${{runner.workspace}}/build-docs/sphinx/html
          single-commit: true
