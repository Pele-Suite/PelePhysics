name: CleanUpCache

on:
  workflow_run:
    workflows: [PelePhysics-CI, Downstream-CI]
    types:
      - completed

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache for ${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clean up ccache
        # Event values go through the environment, not ${{ }} in the script:
        # a branch name is chosen by whoever pushed it (forks included), and
        # pasted into the script it could run shell commands.
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          pr_head_sha: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ "${EVENT}" == "pull_request" ]]; then
            # The run's own PR when it has one (same-repo PRs); otherwise search, keeping
            # only the PR whose head is this commit (a stacked PR also contains it).
            if [ -z "${pr_number}" ]; then
              pr_number=$(gh pr list --search ${pr_head_sha} --json number,headRefOid \
                --jq "map(select(.headRefOid == \"${pr_head_sha}\")) | .[0].number // empty") || true
            fi
            if [ -z "${pr_number}" ]; then
              echo "No open PR for ${pr_head_sha}; nothing to clean up."
              exit 0
            fi
            echo "Clean up cache for PR ${pr_number}"
            BRANCH=refs/pull/${pr_number}/merge
          else
            BRANCH="refs/heads/${HEAD_BRANCH}"
          fi

          # Don't fail the workflow while deleting cache keys.
          set +e

          # Keys are <job id>-git-<sha>-<run id>-<attempt> (e.g. the job id
          # ccache-PelePhysics-CI-Transport-EOS-Reactions-gnu). The run id and
          # attempt let a scheduled run on an unchanged commit,
          # or a re-run, save a fresh cache.
          # Keep the most recently created key of each job and delete the others.
          # Not the most recently used: PRs restore development's cache, so one
          # that restores the old key while this run's other jobs are still
          # going would otherwise make the old key win over the new one.
          keyprefix="ccache-${WORKFLOW_NAME}-"
          cached_jobs=$(gh cache list -L 100 --ref ${BRANCH} --key "${keyprefix}" --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort -u)
          for j in ${cached_jobs}; do
            # `gh cache delete` has no ref filter, so delete by id, not key.
            old_ids=$(gh cache list -L 100 --ref ${BRANCH} --key "${j}-git-" --sort created_at --order desc --json id --jq '.[].id' | tail -n +2)
            for i in ${old_ids}; do
              gh cache delete "${i}" || true
            done
          done
