name: PelePhysics-CI

on:
   workflow_dispatch:
   push:
     branches: [development]
   pull_request:
     branches: [development]

concurrency:
  # Only PR runs cancel an older run: on development a cancelled run would
  # not save its caches, so runs queue, one at a time
  # (GitHub keeps only the newest pending one).
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

# Run steps with bash -eo pipefail, so a failing command stops the step.
defaults:
  run:
    shell: bash

jobs:
  Detect-Changes:
    # A called workflow can only narrow the caller's token permissions, so
    # grant here what its filter job needs.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  Formatting:
    needs: Detect-Changes
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Check formatting
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: './Source ./Testing ./Mechanisms'
          exclude: '.'
          extensions: 'H,h,cpp'
          clangFormatVersion: 20

  Codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install codespell
      - name: Run codespell
        run: codespell

  CEPTR:
    needs: Detect-Changes
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        poetry-version: ['1.4.2']
    defaults:
      run:
        working-directory: ${{github.workspace}}/Support/ceptr
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}
      - name: Run image
        uses: abatilo/actions-poetry@v4.0.0
        with:
          poetry-version: ${{matrix.poetry-version}}
      - name: Install Dependencies using Poetry
        run: poetry install
      - name: Formatting with black
        run: poetry run black --check .
      - name: Sort imports with isort
        run: poetry run isort --check-only --diff .
      - name: Lint with flake8
        run: poetry run flake8 .
      - name: Run tests
        run: poetry run pytest
      - name: Convert air mechanism
        run: poetry run convert -f ${{github.workspace}}/Mechanisms/air/mechanism.yaml
      - name: Convert LiDryer mechanism
        run: poetry run convert -f ${{github.workspace}}/Mechanisms/LiDryer/mechanism.yaml

  Transport-EOS-Reactions:
    needs: Detect-Changes
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    strategy:
      # One backend failing (e.g. a mirror hiccup) should not cancel the
      # others before they report and save their caches.
      fail-fast: false
      matrix:
        comp: [gnu, llvm, cuda, hip, sycl]
        python-version: ['3.11']
        poetry-version: ['1.4.2']
        include:
          - comp: gnu
            amrex_build_args: 'COMP=gnu'
            amrex_build_flags: '--comp=gnu'
          - comp: llvm
            amrex_build_args: 'COMP=llvm'
            amrex_build_flags: '--comp=llvm'
          - comp: cuda
            amrex_build_args: 'COMP=gnu USE_CUDA=TRUE'
            amrex_build_flags: '--comp=gnu --with-cuda=yes'
            dependency_cmds: '.github/workflows/dependencies/dependencies_cuda.sh'
          - comp: hip
            amrex_build_args: 'USE_HIP=TRUE AMD_ARCH=gfx90a LIBRARY_LOCATIONS=/opt/rocm/lib'
            amrex_build_flags: '--with-hip=yes'
            dependency_cmds: '.github/workflows/dependencies/dependencies_hip.sh'
          - comp: sycl
            amrex_build_args: 'USE_SYCL=TRUE'
            amrex_build_flags: '--with-sycl=yes'
            dependency_cmds: '.github/workflows/dependencies/dependencies_dpcpp.sh'
    env:
      PELE_PHYSICS_HOME: ${{github.workspace}}
      MAKE_ARGS: TINY_PROFILE=TRUE USE_CCACHE=TRUE USE_AMREX_LIB=TRUE ${{matrix.amrex_build_args}}
      EXE: ./Pele2d.${{matrix.comp}}.TPROF.ex
      # The GPU backends are only compiled: there is no device to run on.
      HOST_BUILD: ${{matrix.comp == 'gnu' || matrix.comp == 'llvm'}}
      # Manifold models are not built with SYCL.
      BUILD_MANIFOLD: ${{matrix.comp != 'sycl'}}
      CCACHE_MAXSIZE: 1G
      # Only development saves the cache (keep-caches.yml keeps it from
      # being evicted); PRs restore it.
      SAVE_CCACHE: ${{github.ref == 'refs/heads/development'}}
      # Compress hard only when the cache is kept; a PR's new entries are
      # discarded at the end of the job.
      CCACHE_COMPRESSLEVEL: ${{github.ref == 'refs/heads/development' && 10 || 1}}
      # ccache for the CMake-built TPLs (SUNDIALS) too: CMake reads these as
      # the default compiler launchers.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      CMAKE_HIP_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}
      - name: Run image
        if: env.HOST_BUILD == 'true'
        uses: abatilo/actions-poetry@v4.0.0
        with:
          poetry-version: ${{matrix.poetry-version}}
      - name: Clone PelePhysics
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Ccache
        # Outside the checkout: AMReX's script downloads into the current directory.
        working-directory: ${{runner.temp}}
        run: |
          # AMReX's install script (the same ccache as PeleC). It exits 0 even
          # if the download fails, so check the result.
          ${{github.workspace}}/Submodules/amrex/.github/workflows/dependencies/dependencies_ccache.sh > /dev/null
          ccache --version | sed -n 1p
          # Marks the start of the run for Trim Ccache
          touch ${{runner.temp}}/ccache-start
      # Restore only; the cache is saved at the end of the job, and only from
      # development (SAVE_CCACHE). A PR's own pushes would each store a full
      # copy (~1.5 GB per PR across the matrix) for little gain over
      # development's cache.
      - name: Set Up Ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{github.workflow}}-${{github.job}}-${{matrix.comp}}-git-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-${{matrix.comp}}-git-
      # The dependency scripts also export the toolchain's environment to the
      # steps after this one.
      - name: Compiler Dependencies
        if: matrix.dependency_cmds
        run: ${{matrix.dependency_cmds}}
      - name: SUNDIALS and AMReX
        working-directory: Testing/Exec/TranEval
        run: |
          echo "::add-matcher::${{github.workspace}}/.github/problem-matchers/gcc.json"
          ccache -z
          make TPL ${{matrix.amrex_build_args}}
          cd ${PELE_PHYSICS_HOME}/Submodules/amrex
          ./configure --dim=2 --with-mpi=no --enable-particle=no --with-fortran=no --enable-linear-solver=no --enable-fortran-api=no --prefix=./ --enable-tiny-profile=yes ${{matrix.amrex_build_flags}}
          make -j $(nproc) ${{matrix.amrex_build_args}} USE_CCACHE=TRUE USE_SUNDIALS=TRUE SUNDIALS_HOME=${PELE_PHYSICS_HOME}/ThirdParty/INSTALL/*/
          make install
      - name: Unit Test Utilities
        working-directory: Testing/Exec/UtilityUnitTest
        run: |
          make -j $(nproc) ${MAKE_ARGS}
          if [ ${HOST_BUILD} = true ]; then ${EXE} input; fi
          make realclean
      - name: Test Transport
        working-directory: Testing/Exec/TranEval
        run: |
          run_simple() {
            ${EXE} inputs.2d_Simple_Matrix
            ${EXE} inputs.2d_Simple_Matrix transport.matrix_diffusion_niter=1
            ${EXE} inputs.2d_Simple_Matrix transport.matrix_diffusion_niter=30 tran_eval.matrix_ref_tol=1.e-6
            for LCT in lct1 lct3; do
              ${EXE} inputs.2d_Simple_LCT transport.conductivity_model=${LCT}
              ${EXE} inputs.2d_Simple_LCT transport.conductivity_model=${LCT} transport.conductivity_niter=30 tran_eval.lct_ref_tol=1.e-6
            done
          }
          for TYPE in Constant Simple Sutherland Manifold; do
            printf "\n-------- ${TYPE} --------\n"
            case ${TYPE} in
              Manifold) EOS=Manifold; CHEMISTRY=Null ;;
              *)        EOS=Fuego;    CHEMISTRY=air ;;
            esac
            if [ ${TYPE} = Manifold ] && [ ${BUILD_MANIFOLD} != true ]; then continue; fi
            make -j $(nproc) Eos_Model=${EOS} Chemistry_Model=${CHEMISTRY} Transport_Model=${TYPE} ${MAKE_ARGS}
            if [ ${HOST_BUILD} = true ]; then
              ${EXE} inputs.2d_${TYPE}
              case ${TYPE} in
                Manifold) ${EXE} inputs.2d_Network ;;
                Simple)   run_simple ;;
              esac
            fi
            make realclean
          done
          if [ "${{matrix.comp}}" = gnu ]; then
            printf "\n-------- Simple (LiDryer, multicomponent diffusion) --------\n"
            make -j $(nproc) Eos_Model=Fuego Chemistry_Model=LiDryer Transport_Model=Simple ${MAKE_ARGS}
            if [ ${HOST_BUILD} = true ]; then run_simple; fi
            make realclean
            printf "\n-------- Simple (LiDryer, LCT models not compiled in) --------\n"
            make -j $(nproc) Eos_Model=Fuego Chemistry_Model=LiDryer Transport_Model=Simple USE_LCT_TRANSPORT=FALSE ${MAKE_ARGS}
            if [ ${HOST_BUILD} = true ]; then
              ${EXE} inputs.2d_Simple
              ${EXE} inputs.2d_Simple_Matrix
            fi
            make realclean
          fi
      - name: Test EOS
        working-directory: Testing/Exec/EosEval
        run: |
          for TYPE in Fuego GammaLaw Soave-Redlich-Kwong Manifold; do
            printf "\n-------- ${TYPE} --------\n"
            case ${TYPE} in
              Fuego)               CHEMISTRY=LiDryer; TRANSPORT=Constant ;;
              Soave-Redlich-Kwong) CHEMISTRY=LiDryer; TRANSPORT=Simple ;;
              *)                   CHEMISTRY=Null;    TRANSPORT=Constant ;;
            esac
            if [ ${TYPE} = Manifold ] && [ ${BUILD_MANIFOLD} != true ]; then continue; fi
            make -j $(nproc) Eos_Model=${TYPE} Chemistry_Model=${CHEMISTRY} Transport_Model=${TRANSPORT} ${MAKE_ARGS}
            if [ ${HOST_BUILD} = true ]; then
              if [ ${TYPE} = Manifold ]; then
                ${EXE} inputs.2d.table2d
                ${EXE} inputs.2d.network
              else
                ${EXE} inputs.2d
              fi
            fi
            make realclean
          done
      - name: Test Integration
        working-directory: Testing/Exec/ReactEval
        run: |
          # Mechanism, then any extra run arguments
          for SPEC in "drm19" "LiDryer fuel_name=H2"; do
            read -r CHEMISTRY EXTRA <<< "${SPEC}"
            printf "\n-------- ${CHEMISTRY} --------\n"
            make -j $(nproc) Eos_Model=Fuego Chemistry_Model=${CHEMISTRY} ${MAKE_ARGS}
            if [ ${HOST_BUILD} = true ]; then
              for TYPE in Cvode Arkode RK64; do
                printf "\n-------- ${TYPE} --------\n"
                for INPUT in inputs.3d_Array4 inputs.3d_1dArray; do
                  ${EXE} ${INPUT} ${EXTRA} ode.dt=1.e-05 ode.ndt=100 chem_integrator="Reactor${TYPE}"
                done
              done
            fi
            make realclean
          done
      - name: Test Ignition delay
        if: env.HOST_BUILD == 'true'
        working-directory: Testing/Exec/IgnitionDelay
        run: |
          pip install numpy
          make -j $(nproc) Eos_Model=Fuego Chemistry_Model=dodecane_lu ${MAKE_ARGS}
          bash exec_ignDelay.sh firstpass
          python check_ignDelay.py
          rm log PPreaction.txt inputs/inputs.0d_refine
          make realclean
          make -j $(nproc) Eos_Model=Manifold Transport_Model=Manifold Manifold_Dim=1 Chemistry_Model=Null ${MAKE_ARGS}
          bash exec_ignDelay.sh manifold
          python check_ignDelay.py 0.0766 10
          make realclean
      - name: Test Jacobian
        if: env.HOST_BUILD == 'true'
        working-directory: Testing/Exec/Jacobian
        run: |
          MECH=${PELE_PHYSICS_HOME}/Mechanisms/dodecane_lu_qss
          (
            cd ${PELE_PHYSICS_HOME}/Support/ceptr
            poetry install
            poetry run qssa -f ${MECH}/skeletal.yaml -n ${MECH}/non_qssa_list.yaml
            poetry run convert -f ${MECH}/qssa.yaml --qss_format_input ${MECH}/qssa_input_non_optimized.toml --qss_symbolic_jacobian
          )
          make TPL DEBUG=TRUE TINY_PROFILE=TRUE ${{matrix.amrex_build_args}}
          make -j $(nproc) Eos_Model=Fuego Chemistry_Model=dodecane_lu_qss DEBUG=TRUE TINY_PROFILE=TRUE USE_CCACHE=TRUE ${{matrix.amrex_build_args}}
          ./Pele3d.${{matrix.comp}}.DEBUG.TPROF.ex
          make realclean
      - name: Ccache Report
        if: always()
        run: |
          ccache -s
          du -hs ${HOME}/.cache/ccache
      # Hits refresh an entry's mtime: drop what this run did not use, so the
      # saved cache is the current working set rather than everything since
      # the cache was first created. Only after a successful job (the default
      # condition), since a failed one never reached some files.
      - name: Trim Ccache
        if: env.SAVE_CCACHE == 'true'
        run: |
          # A plain assignment, so a missing marker fails the step (bash -e)
          # rather than silently trimming nothing.
          start=$(stat -c %Y ${{runner.temp}}/ccache-start)
          ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          du -hs ${HOME}/.cache/ccache
      - name: Save Ccache
        if: env.SAVE_CCACHE == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ${{steps.ccache.outputs.cache-primary-key}}

  # The one check for branch protection to require. A job skipped by
  # its own `if:` (docs-only changes) does not expand its
  # matrix, so its per-entry checks never report and a PR requiring them
  # waits forever; skipped jobs pass here. It also fails when Detect-Changes
  # fails, which would otherwise skip every build.
  CI-Status:
    needs: [Detect-Changes, Formatting, Codespell, CEPTR, Transport-EOS-Reactions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "${RESULTS}"
          for r in ${RESULTS}; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done
