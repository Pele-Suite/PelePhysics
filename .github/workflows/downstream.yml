name: Downstream-CI

on:
   workflow_dispatch:
   schedule:
     # Twice a week, so the ccaches are refreshed before GitHub evicts them
     # after 7 days without access, with a margin for late scheduled starts.
     - cron: '0 3 * * 1,4'
   push:
     branches: [development]
   pull_request:
     branches: [development]

concurrency:
  # The event is in the group so that a scheduled run and a push to
  # development do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Run steps with bash -eo pipefail, so `build | tee log` fails with the build.
defaults:
  run:
    shell: bash

# Strict warnings for the GNUmake builds. AMReX's comps/gnu.mak assigns
# CXXFLAGS, which overrides a CXXFLAGS environment variable; XTRA_CXXFLAGS is
# appended to it (Tools/GNUMake/Make.defs).
env:
  XTRA_CXXFLAGS: "-Werror -Wshadow -Woverloaded-virtual -Wunreachable-code"

jobs:
  Detect-Changes:
    runs-on: ubuntu-latest
    outputs:
      # Scheduled and manual runs always build, so they refresh the ccaches
      # whatever the last commit touched. Without a push there is no previous
      # commit to compare against, so the filter does not run for them.
      has-source-changes: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        id: changes
        with:
          # A file counts only if it matches every pattern, so the '!'
          # patterns exclude: with the default 'some', '**' matches every
          # file and a docs-only change still ran everything.
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.rst'
              - '!Docs/**'
              - '!Source/Utility/**/*.py'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!.codespell*'
              - '!.gitignore'

  Run:
    needs: Detect-Changes
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    name: ${{ matrix.code }} GNU MPI Run [${{ matrix.case }}]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: PeleLMeX
            case: FlameSheet
            make_args: DIM=2
            run: ./PeleLMeX2d.gnu.MPI.drm19.ex input.2d-regt amr.max_step=2 amr.plot_int=-1 amr.check_int=-1 amrex.abort_on_unused_inputs=1 amr.n_cell=32 64
          - code: PeleC
            case: PMF
            make_args: DIM=3
            run: ./PeleC3d.gnu.MPI.ex example.inp max_step=2 amr.plot_int=-1 amr.check_int=-1 amrex.abort_on_unused_inputs=0 amr.n_cell=8 8 128
    steps:
      - name: Checkout PelePhysics
        uses: actions/checkout@v6
        with:
          path: pelephysics-pr
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clone ${{ matrix.code }}, pointing its PelePhysics at this PR
        run: |
          git clone --depth 1 --recursive --shallow-submodules --single-branch \
            https://github.com/Pele-Suite/${{ matrix.code }}.git
          cd ${{ matrix.code }}/Submodules/PelePhysics
          git fetch "${GITHUB_WORKSPACE}/pelephysics-pr"
          git checkout FETCH_HEAD
          git submodule update --recursive
          echo "PelePhysics submodule now at $(git rev-parse --short HEAD)"
      - name: System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin
      - name: Build
        working-directory: ${{ matrix.code }}/Exec/RegTests/${{ matrix.case }}
        run: |
          make TPL COMP=gnu USE_MPI=TRUE
          make -j $(nproc) ${{ matrix.make_args }} COMP=gnu USE_MPI=TRUE
      - name: Run
        working-directory: ${{ matrix.code }}/Exec/RegTests/${{ matrix.case }}
        run: mpirun -n 2 ${{ matrix.run }}

  clang-tidy:
    needs: Run
    name: ${{ matrix.code }} clang-tidy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: PeleLMeX
            cmake_args: ''
          - code: PeleC
            cmake_args: -DPELE_ENABLE_MASA:BOOL=OFF -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON
    env:
      BUILD_DIR: ${{ github.workspace }}/build-clang-tidy-${{ matrix.code }}
      CCACHE_COMPRESSLEVEL: 10
      CCACHE_EXTRAFILES: ${{ github.workspace }}/${{ matrix.code }}/.clang-tidy
      CCACHE_MAXSIZE: 100M
      # clang-tidy-cache skips files whose preprocessed source, flags and
      # resolved clang-tidy config are unchanged. SAVE_OUTPUT/SAVE_ALL store
      # each file's diagnostics (clang-tidy's stdout) and exit code and replay
      # them on a hit; stderr is not replayed. Comments are kept in the hash
      # so that NOLINT edits invalidate the entry.
      CTCACHE_SAVE_OUTPUT: 1
      CTCACHE_SAVE_ALL: 1
      CTCACHE_KEEP_COMMENTS: 1
    steps:
      - name: Checkout PelePhysics
        uses: actions/checkout@v6
        with:
          path: pelephysics-pr
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clone ${{ matrix.code }}, pointing its PelePhysics at this PR
        run: |
          git clone --depth 1 --recursive --shallow-submodules --single-branch \
            https://github.com/Pele-Suite/${{ matrix.code }}.git
          cd ${{ matrix.code }}/Submodules/PelePhysics
          git fetch "${GITHUB_WORKSPACE}/pelephysics-pr"
          git checkout FETCH_HEAD
          git submodule update --recursive
          echo "PelePhysics submodule now at $(git rev-parse --short HEAD)"
      - name: Install Ccache and clang-tidy-cache
        run: |
          wget -q https://github.com/ccache/ccache/releases/download/v4.8/ccache-4.8-linux-x86_64.tar.xz
          tar xf ccache-4.8-linux-x86_64.tar.xz
          sudo cp -f ccache-4.8-linux-x86_64/ccache /usr/local/bin/
          # ctcache 1.2.0; the module is a self-contained script
          sudo curl -fsSL https://raw.githubusercontent.com/matus-chochlik/ctcache/e33c063ca6e52b48bcefbc45d46d8c150ffa81ca/src/ctcache/clang_tidy_cache.py -o /usr/local/bin/clang-tidy-cache
          sudo chmod +x /usr/local/bin/clang-tidy-cache
          # Keyed on the clang-tidy version, which the ctcache hash does not include
          echo "CTCACHE_DIR=${HOME}/.cache/ctcache/$(clang-tidy --version | sha256sum | cut -c1-12)" >> $GITHUB_ENV
      # Restore and save separately: the combined actions/cache saves only
      # when the whole job passes, so a run that finds warnings would throw
      # away the cache it just filled.
      - name: Set Up Ccache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.code }}-git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.code }}-git-
      - name: Configure
        run: |
          # clang-tidy only needs the compiler frontend (parsing/AST); it never
          # executes the objects, so build at -O0. At -O3 (the Release
          # default) the clang++ 18.1.3 optimizer has crashed (SIGSEGV) on
          # some AMReX files (AMReX_EB_STL_utils.cpp, AMReX_EB2_Level_STL.cpp).
          # CMAKE_BUILD_TYPE=Release keeps NDEBUG consistent with other builds.
          cmake -B${BUILD_DIR} \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DCMAKE_CXX_COMPILER:STRING=clang++ \
          -DCMAKE_C_COMPILER:STRING=clang \
          -DCMAKE_C_FLAGS_RELEASE:STRING="-O0 -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE:STRING="-O0 -DNDEBUG" \
          -DPELE_ENABLE_EB:BOOL=OFF \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_CLANG_TIDY:BOOL=ON \
          "-DCLANG_TIDY_EXE:STRING=clang-tidy-cache;$(command -v clang-tidy)" \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{ matrix.cmake_args }} \
          ${{ github.workspace }}/${{ matrix.code }}
      - name: Check
        id: check
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ${CTCACHE_DIR}
          touch ${{ runner.temp }}/ctcache-start
          build_status=0
          cmake --build . --parallel $(nproc) 2>&1 | tee clang-tidy-full-report.txt || build_status=$?
          # Hits refresh an entry's mtime: drop the ones this run did not use
          # (and older clang-tidy versions) so the cache does not grow. Only
          # after a complete build: a failed one never reached some files.
          if [ ${build_status} -eq 0 ]; then
            find ${CTCACHE_DIR} -type f ! -newer ${{ runner.temp }}/ctcache-start -delete
            find ${HOME}/.cache/ctcache -mindepth 1 -maxdepth 1 ! -path ${CTCACHE_DIR} -exec rm -rf {} +
          fi
          # Fail on a failed build: a replayed cache hit restores the exit
          # code but not clang-tidy's stderr, so the warning count alone can
          # miss it.
          exit ${build_status}
      - name: Ccache Report
        if: ${{ !cancelled() }}
        run: |
          du -hs ~/.cache/ccache ~/.cache/ctcache
          # Entries are named by the rest of their sha1 digest (38 hex
          # characters); the per-directory stats files are not counted.
          echo "ctcache entries: $(find ${CTCACHE_DIR} -type f -regextype posix-extended -regex '.*/[0-9a-f]{38}' | wc -l)"
          ccache -s
      # Saved on PRs too (a cold run takes hours, and the cache is small),
      # whenever Check completed the build, even if Short report then fails
      # on warnings.
      - name: Save Ccache
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.code }}-git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Short report
        if: ${{ !cancelled() }}
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "::add-matcher::${{ github.workspace }}/pelephysics-pr/.github/problem-matchers/gcc.json"
          ${{ github.workspace }}/pelephysics-pr/.github/scripts/count_warnings.sh clang-tidy-full-report.txt
