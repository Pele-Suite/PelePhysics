name: CleanUpCachePostPR

on:
  workflow_run:
    workflows: [PostPR]
    types:
      - completed

jobs:
  CleanUpCcacheCachePostPR:
    name: Clean Up Ccache Cache Post PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clean up ccache
        # Event values go through the environment, not ${{ }} in the script:
        # a branch name is chosen by whoever pushed it (forks included), and
        # pasted into the script it could run shell commands.
        env:
          pr_head_sha: ${{ github.event.workflow_run.head_sha }}
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # The run's own PR when it has one (same-repo PRs); otherwise search, keeping
          # only the PR whose head is this commit (a stacked PR also contains it).
          if [ -z "${pr_number}" ]; then
            pr_number=$(gh pr list --state all --search ${pr_head_sha} --json number,headRefOid \
              --jq "map(select(.headRefOid == \"${pr_head_sha}\")) | .[0].number // empty") || true
          fi
          if [ -z "${pr_number}" ]; then
            echo "No PR for ${pr_head_sha}; nothing to clean up."
            exit 0
          fi
          echo "Post-PR cache cleanup for PR ${pr_number}"

          # `gh cache delete` has no ref filter, so delete by id, not key.
          # `|| true`: a failed deletion should not fail the workflow.
          for i in $(gh cache list -L 100 --ref refs/pull/${pr_number}/merge --json id --jq '.[].id'); do
            gh cache delete "${i}" || true
          done
