name: KeepCaches

# GitHub evicts a cache after 7 days without access, and a restore counts as
# an access. Twice a week (a margin for late scheduled starts), this restores
# each of development's ccaches, so PRs still find them when development has
# had no push for a while; no build runs, and nothing is saved. The ccaches
# themselves are only saved by PelePhysics-CI and Downstream-CI runs on
# development.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1,4'

permissions:
  # gh cache list
  actions: read
  contents: read

jobs:
  List:
    runs-on: ubuntu-latest
    outputs:
      caches: ${{steps.list.outputs.caches}}
    steps:
      - name: List development's ccaches
        id: list
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          # gh reads the repository from here, so no checkout is needed.
          GH_REPO: ${{github.repository}}
        # bash -e alone lets a failing gh hide behind jq's exit status.
        shell: bash
        run: |
          # Each cache with the path its job saved it with: a restore must
          # give the same path, or it misses. Keep these in step with the Save
          # Ccache steps (Downstream-CI's clang-tidy saves its ccache and
          # ctcache, PelePhysics-CI its ccache).
          caches=$(gh cache list -L 100 --ref refs/heads/development --key ccache- --json key | jq -c '[.[].key | {key: .,
            path: (if test("^ccache-Downstream-CI-clang-tidy-") then "~/.cache/ccache\n~/.cache/ctcache" else "~/.cache/ccache" end)}]')
          echo "${caches}" | jq .
          echo "caches=${caches}" >> "$GITHUB_OUTPUT"
  Restore:
    needs: List
    if: needs.List.outputs.caches != '[]'
    strategy:
      fail-fast: false
      matrix:
        cache: ${{fromJSON(needs.List.outputs.caches)}}
    name: Restore ${{matrix.cache.key}}
    runs-on: ubuntu-24.04
    steps:
      # Fails on a miss, which means the path here no longer matches the one
      # the cache was saved with.
      - uses: actions/cache/restore@v5
        with:
          path: ${{matrix.cache.path}}
          key: ${{matrix.cache.key}}
          fail-on-cache-miss: true
